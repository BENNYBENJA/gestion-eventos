services:
  - type: web
    name: gestion-eventos-centro-comunitario
    runtime: python
    plan: free
    region: oregon
    buildCommand: "bash ./build.sh"
    startCommand: "gunicorn gestion_eventos.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DB_ENGINE
        value: "sqlite"
      - key: SQLITE_NAME
        value: "db.sqlite3"
